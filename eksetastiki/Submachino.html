<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="Images/favicon.png">
    <title>SubMachino</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!----- The Starting Page --------> 

    <div class="Start">
        <img id="myP" src="Images/start.jpg">
        <button id="myB" type="button" onclick="myFunction()">Start</button> 
    </div>



<!----- End of Start Page -------->


<!----- The Lobby Page -------->



    <div class="Lobby">
        <div class="container" id="myL">
            <div class="pointerr">
                <img id="myLefty" src="Images/right.png" alt="Clickable Image" class="LobbyLefty">
                <img id="myLobbyRighty" src="Images/right.png" alt="Clickable Image" class="LobbyRighty">
                <img src="Images/barracks.png" class="barracks">
                <img id="Exit" src="Images/DADO.png" class="exit2" >
                <img src="Images/ZADO.png" class="exit" >

            </div>

            <img src="Images/FirstItem.png" class="item1_1">
            <img src="Images/SecondItem.png" class="item2_1">
            <img src="Images/ThirdItem.png" class="item3_1">

            <img src="Images/lobby.png">
            <img id="Almost" src="Images/LastItem.png" class="Almost">
            <img id="finished" src="Images/FinishedItem.png" class="finished">

        </div>
        
    </div>






<!----- End of Lobby Page -------->


<!----- The Left Room Page -------->

    <div class="LeftRoom">
        <img class="rooming" src="Images/FindImageRoom.png">
        <img src="Images/ThirdItem.png " class="item3_2">
        <div class="pointerr">
                <img src="Images/SecondItem.png " class="item2_2" >
                <img id="myRighty" src="Images/right.png" alt="Clickable Image" class="Righty">

        </div>


        <h1>Score : <span id="score"> </span> </h1>
        <div class="FindTheDifference">

            <img src="Images/FirstItem.png" class="item1_2">
            

            <div class="canva">

                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot1">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot2">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot3">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot4">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot5">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot6">
                <img src="Images/highlighter.png" class="hidden" class="highlit" id="spot7">

                <img class="Artboard" src="Images/Artboard 1.jpg" usemap="#Map">

                <map name="Map">
                    <area shape="circle" coords="770,300,32"   class="spot1"> <!-- Antras -->
                    <area shape="circle" coords="630,370,32"   class="spot2"> <!-- Paidaki1 -->
                    <area shape="circle" coords="555,275,32"    class="spot3"> <!-- Skulaki -->
                    <area shape="circle" coords="870,184,32"    class="spot4"> <!-- Podaraki -->
                    <area shape="circle" coords="730,389,32"    class="spot5"> <!-- Radio -->
                    <area shape="circle" coords="527,440,32"    class="spot6"> <!-- Paidaki2 -->
                    <area shape="circle" coords="945,500,32"    class="spot7"> <!-- Kapelo -->
                </map> 

            </div>

        </div>
    </div>

<!----- End of Left Room Page -------->

<!----- Start of Right Room -->

    <div class="RightRoom">
        <div class="imaging">
            <img class="riro" src="Images/RightRoom.png">
            <img id="myLefty2" src="Images/right.png" alt="Clickable Image" class="LobbyLefty2">
            <img src="Images/barracks.png" class="barracks2">
            <img src="Images/FirstItem.png" class="item1_3">
            <img id="btn1" src="Images/TheButton.png" class="button1">
            <img src="Images/SecondItem.png" class="item2_3">
            <img id="myRightRighty" src="Images/right.png" alt="Clickable Image" class="RightRighty">
            <img src="Images/ThirdItem.png" class="item3_3">
        </div>
    </div>




<!----- End of Right Room -->

<!--- Start of Last Room Page -------->
<div class="LastRoom">
    <img src="Images/LastRoom.png" class="LastRoomImage">

    <img src="Images/FirstItem.png" class="item1_4">
    <img src="Images/SecondItem.png" class="item2_4">
    <img src="Images/ThirdItem.png" class="item3_4" id="lastPiece" style="display:none;">

    <img id="myLastLefty" src="Images/right.png" alt="Clickable Image" class="LastLefty">

    <!-- Combination Lock Game Start -->
    <div class="lock-cage" style="margin: 40px auto 0 auto;">
        <div style="margin-bottom:18px; color:#fff; font-size:1.1em;">
        <span style="color:#3af;font-weight:bold;">Blue</span>: Too low&nbsp;&nbsp;
        <span style="color:#f33;font-weight:bold;">Red</span>: Too high&nbsp;&nbsp;
        <span style="color:#3c3;font-weight:bold;">Green</span>: Just right
    </div>
        <div class="bars">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
            <div class="bar4"></div>
            <div class="bar5"></div>
        </div>
        <div class="lock">
            <div class="digit">
                <button onclick="changeDigit(0, 1)">▲</button>
                <div class="number" id="num0">1</div>
                <button onclick="changeDigit(0, -1)">▼</button>
            </div>
            <div class="digit">
                <button onclick="changeDigit(1, 1)">▲</button>
                <div class="number" id="num1">1</div>
                <button onclick="changeDigit(1, -1)">▼</button>
            </div>
            <div class="digit">
                <button onclick="changeDigit(2, 1)">▲</button>
                <div class="number" id="num2">1</div>
                <button onclick="changeDigit(2, -1)">▼</button>
            </div>
            <div class="digit">
                <button onclick="changeDigit(3, 1)">▲</button>
                <div class="number" id="num3">1</div>
                <button onclick="changeDigit(3, -1)">▼</button>
            </div>
        </div>
        <button class="lock-btn" id="lockBtn" onclick="lockAnswer()">Lock Answer</button>
        <button class="try-again-btn" id="tryAgainBtn" onclick="tryAgain()" style="display:none;">Try Again</button>
    </div>
    <!-- Combination Lock Game End -->



</div>
<!-- End of Last Room Page -------->

<!--- Bye Bye -->
    <div class="BYEE">
        <img class="zahad" src="Images/BYEE.png">
    </div>


<!--- End Of Bye Bye-->



    <script src="js/game.js"></script>
</body>

</html>
